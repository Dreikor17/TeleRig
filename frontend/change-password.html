<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeleRig — change password</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23111214'/%3E%3Cg fill='none' stroke='%2310b981' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' transform='translate(2.4 2.4) scale(.8)'%3E%3Cpath d='M4.9 16.1C1 12.2 1 5.8 4.9 1.9'/%3E%3Cpath d='M7.8 4.7a6.14 6.14 0 0 0-.8 7.5'/%3E%3Ccircle cx='12' cy='9' r='2'/%3E%3Cpath d='M16.2 4.8c2 2 2.26 5.11.8 7.47'/%3E%3Cpath d='M19.1 1.9a9.96 9.96 0 0 1 0 14.1'/%3E%3Cpath d='M9.5 18h5'/%3E%3Cpath d='m8 22 4-11 4 11'/%3E%3C/g%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("telerig.theme");if(t===null)t=localStorage.getItem("radiowebop.theme");if(t==="day")document.documentElement.classList.add("day")}catch(e){}</script>
<style>
  :root{color-scheme:dark;
    --bg:#0a0a0a;--surface:#151619;--surface-2:#111214;--field:#0a0a0a;--border:#2a2b2e;
    --txt:#e0e0e0;--txt-dim:#8e9299;--txt-faint:#5a5b5e;--accent:#10b981;--accent-hi:#34d399;--accent-solid:#047857;
    --accent-tint:rgba(16,185,129,.10);--danger:#ef4444;--danger-hi:#f87171;--danger-tint:rgba(239,68,68,.10);
    --r-card:12px;--r-ctl:8px;
    --font-ui:ui-monospace,"Cascadia Mono","SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --font-prose:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  :root.day{color-scheme:light;
    --bg:#eceef1;--surface:#ffffff;--surface-2:#f1f3f5;--field:#ffffff;--border:#d5d8de;
    --txt:#16181b;--txt-dim:#5a6068;--txt-faint:#8a909a;--accent:#059669;--accent-hi:#047857;--accent-solid:#047857;
    --accent-tint:rgba(5,150,105,.08);--danger:#dc2626;--danger-hi:#b91c1c;--danger-tint:rgba(220,38,38,.07)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--font-prose)}
  body{display:flex;justify-content:center;align-items:flex-start;padding:max(6vh,24px) 16px 24px}
  .col{width:100%;max-width:384px}
  .card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-card);padding:24px}
  h1{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:700 12px var(--font-ui);letter-spacing:.14em;color:var(--accent-hi)}
  h1 svg{width:18px;height:18px}
  .sub{margin:0 0 14px;font-size:13px;color:var(--txt-dim);line-height:1.45}
  label{display:block;font:700 10px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--txt-dim);margin:14px 0 6px}
  .hint{font-weight:400;letter-spacing:0;text-transform:none;color:var(--txt-dim)}
  input{width:100%;padding:10px 12px;font:15px var(--font-ui);border-radius:var(--r-ctl);border:1px solid var(--border);
    background:var(--field);color:var(--txt);outline:none}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  .ferr{margin-top:6px;font-size:12.5px;color:var(--danger-hi)}
  ul.check{list-style:none;margin:14px 0 0;padding:0;font:12px var(--font-ui);color:var(--txt-dim)}
  ul.check li{margin:3px 0}
  ul.check li.ok{color:var(--accent-hi)}
  .btn{margin-top:18px;width:100%;padding:11px;font:700 14px var(--font-ui);letter-spacing:.06em;border:none;
    border-radius:var(--r-ctl);cursor:pointer;color:#fff;background:var(--accent-solid)}
  .btn:disabled{opacity:.55;cursor:default}
  .box{margin:0 0 12px;padding:10px 12px;border-radius:var(--r-ctl);font-size:13px}
  .box.err{background:var(--danger-tint);border:1px solid var(--danger);color:var(--danger-hi)}
  .out{margin-top:14px;text-align:center;font-size:12.5px}
  .out button{background:none;border:none;color:var(--txt-dim);text-decoration:underline;cursor:pointer;font:inherit}
  footer{margin-top:18px;text-align:center;font:11px var(--font-ui);color:var(--txt-dim)}
  footer a{color:var(--txt-dim)}
</style>
</head>
<body>
<!--TR_AUTH_ICONS-->
<main class="col">
  <form class="card" id="f" novalidate>
    <h1><svg aria-hidden="true"><use href="#i-key-round"/></svg>CHANGE PASSWORD REQUIRED</h1>
    <p class="sub" id="sub">Choose a new password before continuing.</p>
    <div id="errBox" class="box err" role="alert" hidden></div>
    <label for="cur">Current password</label>
    <input id="cur" type="password" autocomplete="current-password" maxlength="128" autofocus>
    <div class="ferr" id="curErr" hidden></div>
    <label for="new">New password <span class="hint">8–72 characters</span></label>
    <input id="new" type="password" autocomplete="new-password" maxlength="128">
    <div class="ferr" id="newErr" hidden></div>
    <label for="rep">Confirm new password</label>
    <input id="rep" type="password" autocomplete="new-password" maxlength="128">
    <ul class="check" id="check" aria-live="polite">
      <li id="cLen">○ 8–72 bytes</li>
      <li id="cMatch">○ Matches</li>
      <li id="cDiff">○ Different from the current password</li>
    </ul>
    <button class="btn" id="btn" type="submit" disabled>Change password</button>
    <div class="out"><button type="button" id="signout">Sign out</button></div>
  </form>
  <footer>TeleRig · <a href="https://github.com/Dreikor17/TeleRig" target="_blank" rel="noopener">Source (AGPL-3.0)</a></footer>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var cur = $("cur"), nw = $("new"), rep = $("rep"), btn = $("btn"), errBox = $("errBox");
  var busy = false, lockedUntil = 0, lockTimer = null;
  var enc = window.TextEncoder ? new TextEncoder() : null;
  function bytes(s) { return enc ? enc.encode(s).length : unescape(encodeURIComponent(s)).length; }
  function mark(el, ok, text) { el.className = ok ? "ok" : ""; el.textContent = (ok ? "✓ " : "○ ") + text; }

  fetch("/api/auth_status", { credentials: "same-origin" }).then(function (r) { return r.json(); }).then(function (s) {
    if (!s || !s.authed) { location.replace("/login"); return; }
    var sub = $("sub");
    sub.textContent = s.default_pw ? "The default password can't be kept — choose your own."
                                   : "Welcome, " + s.user + ". Choose a new password before continuing.";
    if (!s.must_change) {
      $("f").querySelector("h1").lastChild.textContent = "CHANGE PASSWORD";
    }
  }).catch(function () {});

  function problems() {
    var n = bytes(nw.value);
    var ok = { len: n >= 8 && n <= 72, match: nw.value !== "" && nw.value === rep.value,
               diff: nw.value !== "" && nw.value !== cur.value };
    mark($("cLen"), ok.len, "8–72 bytes");
    mark($("cMatch"), ok.match, "Matches");
    mark($("cDiff"), ok.diff, "Different from the current password");
    if (n < 8) return "The new password needs at least 8 bytes.";
    if (n > 72) return "The new password can be at most 72 bytes.";
    if (!ok.match) return "The two new passwords don't match.";
    if (!cur.value) return "Enter your current password.";
    if (!ok.diff) return "Choose a password that is different from the current one.";
    return null;
  }
  function refresh() { btn.disabled = busy || Date.now() < lockedUntil || problems() !== null; }
  [cur, nw, rep].forEach(function (el) { el.addEventListener("input", refresh); });

  function fieldErr(field, msg) {
    var el = field === "current" ? $("curErr") : $("newErr");
    el.textContent = msg; el.hidden = false;
    (field === "current" ? cur : nw).focus();
  }
  function startLock(sec) {
    lockedUntil = Date.now() + sec * 1000;
    clearInterval(lockTimer);
    var tick = function () {
      var left = Math.max(0, Math.ceil((lockedUntil - Date.now()) / 1000));
      if (left <= 0) { clearInterval(lockTimer); errBox.hidden = true; refresh(); return; }
      errBox.textContent = "Too many attempts. Try again in " + Math.floor(left / 60) + ":" + ("0" + left % 60).slice(-2);
      errBox.hidden = false;
    };
    tick(); lockTimer = setInterval(tick, 1000); refresh();
  }

  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var p = problems();
    if (p) { errBox.textContent = p; errBox.hidden = false; return; }
    errBox.hidden = true; $("curErr").hidden = true; $("newErr").hidden = true;
    busy = true; refresh();
    fetch("/api/me/password", { method: "POST", credentials: "same-origin",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ current: cur.value, new: nw.value }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return [r.status, j]; }); })
      .then(function (res) {
        var st = res[0], j = res[1] || {};
        if (st === 200 && j.ok) { location.replace("/"); return; }
        if (st === 429) startLock(j.retry_after || 60);
        else if (j.field) fieldErr(j.field, j.message || "Not accepted.");
        else { errBox.textContent = j.message || ("Could not change the password (HTTP " + st + ")."); errBox.hidden = false; }
      })
      .catch(function () { errBox.textContent = "Can't reach the server — check the connection."; errBox.hidden = false; })
      .then(function () { busy = false; refresh(); });
  });

  $("signout").addEventListener("click", function () {
    fetch("/api/logout", { method: "POST", credentials: "same-origin",
                           headers: { "Content-Type": "application/json" }, body: "{}" })
      .catch(function () {}).then(function () { location.replace("/login"); });
  });
  refresh();
})();
</script>
</body>
</html>
